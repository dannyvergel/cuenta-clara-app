name: Ingesta de datos abiertos
on:
  workflow_dispatch:
  push:
    branches: [datos/ingesta-rosario]
    paths: [.github/workflows/ingesta.yml]
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar compras de Rosario
        run: |
          mkdir -p datos
          for y in 2021 2022 2023 2024; do
            curl -fsSL -m 600 --retry 3 -A "Mozilla/5.0" -o datos/rosario_$y.csv \
              "https://datosabiertos.rosario.gob.ar/sites/default/files/resources/licitaciones_$y.csv" || echo "falló $y"
          done
          ls -la datos; head -c 2000 datos/rosario_2024.csv || true
      - uses: actions/upload-artifact@v4
        with:
          name: rosario-csv
          path: datos/
